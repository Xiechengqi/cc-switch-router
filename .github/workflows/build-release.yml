name: Build and Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    concurrency:
      group: router-frontend-${{ github.ref }}
      cancel-in-progress: true
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate repository provenance and CI contracts
        run: |
          bash scripts/ci/timed.sh 'Provenance audit' node scripts/audit/audit-source-provenance.mjs
          node scripts/audit/audit-provider-icon-provenance.mjs
          node --test scripts/audit/source-provenance.test.mjs scripts/audit/provider-icon-provenance.test.mjs scripts/audit/share-contract-versions.test.mjs scripts/ci/ci.test.mjs

      - name: Cache Twemoji flag sources
        uses: actions/cache@v5
        with:
          path: frontend/.cache/flag-src
          key: twemoji-14.0.2-flag-src

      - name: Cache generated flags
        uses: actions/cache@v5
        with:
          path: frontend/public/flags
          key: flags-${{ runner.os }}-${{ hashFiles('frontend/scripts/raster-flags.mjs', 'frontend/scripts/flag-slugs.txt', 'frontend/package-lock.json') }}

      - name: Cache Next.js build intermediates
        uses: actions/cache@v5
        with:
          path: frontend/.next/cache
          key: next-${{ runner.os }}-node24-${{ hashFiles('frontend/package-lock.json', 'frontend/next.config.mjs') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-node24-${{ hashFiles('frontend/package-lock.json', 'frontend/next.config.mjs') }}-

      - name: Install frontend dependencies
        run: bash scripts/ci/timed.sh 'npm ci' npm --prefix frontend ci

      - name: Test frontend units
        working-directory: frontend
        run: |
          bash ../scripts/ci/timed.sh 'Flags' npm run test:flags
          npm run test:token-units
          npm run test:usd-micros
          npm run test:auth-password
          npm run test:market-wallet
          npm run test:market-notifications
          npm run test:share-market
          npm run test:client-market
          npm run test:providers
          npm run test:share-model-probe
          npm run test:share-model-health-heatmap
          npm run test:share-settings
          npm run test:share-value-quota

      - name: Audit frontend contracts
        working-directory: frontend
        run: |
          npm run audit:settings-i18n
          npm run audit:market-billing-contract
          npm run audit:web-token-units
          npm run audit:share-model-health-contract
          npm run audit:model-prices

      - name: Build frontend assets
        working-directory: frontend
        run: bash ../scripts/ci/timed.sh 'Next.js export' npm run build

      - name: Upload frontend export for the same commit
        uses: actions/upload-artifact@v6
        with:
          name: frontend-${{ github.sha }}
          path: frontend/out/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Test wallet and C2C browser contracts
        working-directory: frontend
        run: |
          bash ../scripts/ci/timed.sh 'Client checkout browser' npm run test:client-checkout-browser
          bash ../scripts/ci/timed.sh 'Client termination browser' npm run test:client-termination-browser
          bash ../scripts/ci/timed.sh 'Client rental audit browser' npm run test:client-rental-audit-browser
          bash ../scripts/ci/timed.sh 'Wallet checkout browser' npm run test:wallet-checkout-browser
          bash ../scripts/ci/timed.sh 'C2C browser' npm run test:c2c-browser
          bash ../scripts/ci/timed.sh 'Navbar wallet browser' npm run test:navbar-wallet-browser
          bash ../scripts/ci/timed.sh 'Password authentication browser' npm run test:auth-password-browser
          bash ../scripts/ci/timed.sh 'Marketplace email diagnostics browser' npm run test:market-notifications-browser

  rust-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    concurrency:
      group: router-tests-${{ github.ref }}
      cancel-in-progress: true
    env:
      RUST_TEST_THREADS: 4
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust test dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: router-tests
          cache-on-failure: false

      - name: Compile test binary once
        # build.rs watches this path even without embedded debug UI. A missing
        # watched path makes Cargo rerun the build script on every test command.
        run: |
          mkdir -p frontend/out
          bash scripts/ci/timed.sh 'Rust test compilation' cargo test --locked --no-run

      - name: Test database adapter and isolated templates
        run: |
          bash scripts/ci/timed.sh 'Database adapter' cargo test --locked db::tests
          bash scripts/ci/timed.sh 'Test database templates' cargo test --locked test_support::tests

      - name: Test notification center and incident export
        run: |
          bash scripts/ci/timed.sh 'Notification center' cargo test --locked user_notifications::tests
          bash scripts/ci/timed.sh 'Incident export' cargo test --locked alerting::store::tests

      - name: Test all market contracts
        # market_ does not match modules named share_market / client_market.
        # Keep full service-control coverage, not just wallet helper tests.
        run: |
          bash scripts/ci/timed.sh 'Market contracts' cargo test --locked market_ -- --skip schema::tests
          bash scripts/ci/timed.sh 'Share rental contracts' cargo test --locked share_market::tests
          bash scripts/ci/timed.sh 'Client rental contracts' cargo test --locked client_market::tests
          bash scripts/ci/timed.sh 'Termination chat contracts' cargo test --locked client_termination_chat_

      - name: Test password authentication and administrator CLI
        run: |
          bash scripts/ci/timed.sh 'Password credentials' cargo test --locked password_auth::tests
          bash scripts/ci/timed.sh 'Password HTTP boundaries' cargo test --locked password_ -- --skip password_auth::tests
          bash scripts/ci/timed.sh 'User administrator CLI' cargo test --locked user_cli::tests
          bash scripts/ci/timed.sh 'Session authentication' cargo test --locked session_
          bash scripts/ci/timed.sh 'Email authentication' cargo test --locked auth_code_verification_

      - name: Test real migrations without template shortcuts
        run: bash scripts/ci/timed.sh 'Real schema migrations' cargo test --locked schema::tests

      - name: Test Share value quota contracts
        run: |
          bash scripts/ci/timed.sh 'Share value pricing and signed projections' cargo test --locked share_value
          bash scripts/ci/timed.sh 'Share reader compatibility' cargo test --locked share_contract_reader
          bash scripts/ci/timed.sh 'Share authorization contracts' cargo test --locked share_user

  build:
    needs: frontend
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    concurrency:
      group: router-build-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      CC_SWITCH_ROUTER_BUILD_COMMIT: ${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust release dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: router-release-x86_64-unknown-linux-gnu
          cache-on-failure: false

      - name: Download frontend export from this run and commit
        uses: actions/download-artifact@v7
        with:
          name: frontend-${{ github.sha }}
          path: frontend/out

      - name: Get version from Cargo.toml
        id: version
        run: |
          VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build release binary
        run: bash scripts/ci/timed.sh 'Rust release compilation' cargo build --locked --release --target x86_64-unknown-linux-gnu

      - name: Verify build identity and embedded frontend
        run: bash scripts/ci/timed.sh 'Release artifact verification' node scripts/ci/verify-release.mjs target/x86_64-unknown-linux-gnu/release/cc-switch-router frontend/out "$GITHUB_SHA"

      - name: Prepare release assets
        run: |
          mkdir -p release-files
          cp target/x86_64-unknown-linux-gnu/release/cc-switch-router release-files/cc-switch-router-linux-amd64
          chmod +x release-files/cc-switch-router-linux-amd64

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: cc-switch-router-linux-amd64
          path: release-files/cc-switch-router-linux-amd64
          if-no-files-found: error
          compression-level: 1
          retention-days: 3

  release:
    needs: [frontend, rust-tests, build]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    # Never cancel a publication in the middle of moving a tag/uploading an
    # asset. The script rejects old commits after acquiring this serial slot.
    concurrency:
      group: router-publish-latest
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download verified artifact from this run
        uses: actions/download-artifact@v7
        with:
          name: cc-switch-router-linux-amd64
          path: release-files

      - name: Publish only the current master without deleting latest
        env:
          GH_TOKEN: ${{ github.token }}
          ROUTER_RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: bash scripts/ci/timed.sh 'Publish latest' bash scripts/ci/publish-release.sh
