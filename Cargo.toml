[package]
name = "cc-switch-router"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
anyhow = "1"
async-stream = "0.3"
async-trait = "0.1"
axum = { version = "0.7", features = ["json", "ws"] }
base64 = "0.22"
bs58 = { version = "0.5", features = ["check"] }
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
futures-util = "0.3"
flate2 = "1"
fs2 = "0.4"
hmac = "0.12"
httpdate = "1"
hex = "0.4"
http = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
libsql = { version = "=0.9.30", default-features = false, features = ["replication", "tls"] }
portable-pty = "0.8"
rand = "0.8"
rand_0_10 = { package = "rand", version = "0.10" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
resend-rs = "0.15"
# 0.46 busy-polls ChannelTx when a peer's channel window reaches zero.
russh = { version = "=0.62.6", default-features = false, features = ["flate2", "ring"] }
rusqlite = { package = "libsql-rusqlite", version = "=0.9.30" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
rpassword = "7"
